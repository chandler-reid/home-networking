services:
  unifi-db:
    image: mongo:7.0
    container_name: unifi-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_USER: unifi
      MONGO_PASS: ${MONGO_PASS}
      MONGO_DBNAME: unifi
      MONGO_AUTHSOURCE: admin
    volumes:
      - ./data/mongo:/data/db
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro

  unifi:
    image: lscr.io/linuxserver/unifi-network-application:8.6.9
    container_name: unifi
    restart: unless-stopped
    depends_on:
      - unifi-db
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/New_York
      MONGO_USER: unifi
      MONGO_PASS: ${MONGO_PASS}
      MONGO_HOST: unifi-db
      MONGO_PORT: 27017
      MONGO_DBNAME: unifi
      MONGO_AUTHSOURCE: admin
    volumes:
      - ./data/unifi:/config
    ports:
      - "8443:8443" # web UI / API
      - "8080:8080" # device inform
      - "3478:3478/udp" # STUN
      - "10001:10001/udp" # AP discovery
